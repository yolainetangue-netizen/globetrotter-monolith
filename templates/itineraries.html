<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes itinéraires - GlobeTrotter-Kribi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <main class="container my-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="h4 mb-4">Mes itinéraires</h2>
        <div id="content"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const content = document.getElementById("content");

    async function loadItineraries() {
      if (!isLoggedIn()) {
        content.innerHTML = `<div class="alert alert-warning mb-0">Vous devez être <a href="/login-page">connecté</a> pour voir vos itinéraires.</div>`;
        return;
      }

      const { ok, data } = await apiRequest("/itineraries", { auth: true });

      if (!ok) {
        content.innerHTML = `<p class="hint">Impossible de charger les itinéraires.</p>`;
        return;
      }

      if (data.length === 0) {
        content.innerHTML = `<p class="hint">Aucun itinéraire pour le moment. Rendez-vous sur <a href="/destinations-page">Destinations</a> pour en créer un.</p>`;
        return;
      }

      // On recupere le nom de chaque destination pour un affichage plus lisible
      const destResults = await Promise.all(
        data.map((it) => apiRequest(`/destinations/${it.destination_id}`))
      );
      const destNames = {};
      destResults.forEach((r, i) => {
        destNames[data[i].destination_id] = r.ok ? r.data.name : `#${data[i].destination_id}`;
      });

      const rows = data
        .map(
          (it) => `
        <tr>
          <td class="fw-semibold">${it.title}</td>
          <td><a href="/destination/${it.destination_id}" class="text-decoration-none">${destNames[it.destination_id]}</a></td>
          <td>${it.start_date || "—"}</td>
          <td>${it.end_date || "—"}</td>
          <td class="text-muted small">${it.notes || "—"}</td>
        </tr>`
        )
        .join("");

      content.innerHTML = `
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr><th>Titre</th><th>Destination</th><th>Début</th><th>Fin</th><th>Notes</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    loadItineraries();
  </script>
</body>
</html>
