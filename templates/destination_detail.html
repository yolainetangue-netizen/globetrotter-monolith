<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail du lieu - GlobeTrotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>🌍 GlobeTrotter</h1>
    <nav>
      <a href="/">Accueil</a>
      <a href="/destinations-page">Destinations</a>
      <a href="/map-page">Carte</a>
      <a href="/transport-page">Transport</a>
      <a href="/itineraries-page">Mes itinéraires</a>
      <a href="/register-page">Inscription</a>
      <a href="#" id="auth-link" class="nav-cta">Connexion</a>
    </nav>
  </header>

  <main>
    <a href="/destinations-page" class="back-link">&larr; Retour aux destinations</a>

    <div id="detail-content">
      <p class="hint">Chargement...</p>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const DESTINATION_ID = {{ destination_id }};
    const container = document.getElementById("detail-content");

    const CATEGORY_CLASS = {
      "Site historique": "cat-heritage",
      "Nature": "cat-nature",
      "Distraction": "cat-fun",
      "Restaurant": "cat-food",
      "Hôtel": "cat-hotel",
    };
    const CATEGORY_ICON = {
      "Site historique": "🏛️",
      "Nature": "🌿",
      "Distraction": "🎉",
      "Restaurant": "🍽️",
      "Hôtel": "🏨",
    };

    function renderDetail(d) {
      const catClass = CATEGORY_CLASS[d.category] || "cat-heritage";
      const icon = CATEGORY_ICON[d.category] || "📍";
      const query = (d.image_query || `${d.name} ${d.city} Cameroun`).replace(/"/g, "");
      const media = `<div class="placeholder-media photo-slot ${catClass} detail-placeholder" data-photo-query="${query}"><span>${icon}</span></div>`;

      const activities = (d.activities || [])
        .map((a) => `<li>${a}</li>`)
        .join("");

      const practical = d.practical_info
        ? `
          <div class="card">
            <h2>Informations pratiques</h2>
            <table class="practical-table">
              ${d.practical_info.hours ? `<tr><td>Horaires</td><td>${d.practical_info.hours}</td></tr>` : ""}
              ${d.practical_info.price ? `<tr><td>Tarif indicatif</td><td>${d.practical_info.price}</td></tr>` : ""}
              ${d.practical_info.best_time ? `<tr><td>Meilleure période</td><td>${d.practical_info.best_time}</td></tr>` : ""}
              ${d.practical_info.access ? `<tr><td>Accès</td><td>${d.practical_info.access}</td></tr>` : ""}
            </table>
          </div>
        `
        : "";

      const hasSeasonal = d.budget_saison_seche || d.budget_saison_pluies;
      const budgetBlock = (d.budget || hasSeasonal)
        ? `
          <div class="card">
            <h2>💰 Budget selon la saison</h2>
            ${hasSeasonal ? `
              <div class="season-grid">
                <div class="season-box season-dry">
                  <p class="season-label">☀️ Saison sèche</p>
                  <p>${d.budget_saison_seche || d.budget || ""}</p>
                </div>
                <div class="season-box season-wet">
                  <p class="season-label">🌧️ Saison des pluies</p>
                  <p>${d.budget_saison_pluies || d.budget || ""}</p>
                </div>
              </div>
            ` : `<p>${d.budget}</p>`}
            <p class="hint">Les prix sont indicatifs, à confirmer sur place ; ils varient selon la négociation et l'affluence.</p>
          </div>
        `
        : "";

      const transportBlock = d.transport
        ? `
          <div class="card">
            <h2>🚖 Transport</h2>
            <table class="practical-table transport-table">
              ${typeof d.transport === "object"
                ? `
                  <tr><td>🚕 Taxi</td><td>${d.transport.taxi || "—"}</td></tr>
                  <tr><td>🏍️ Moto-taxi</td><td>${d.transport.moto || "—"}</td></tr>
                  ${d.transport.note ? `<tr><td>ℹ️ Bon à savoir</td><td>${d.transport.note}</td></tr>` : ""}
                `
                : `<tr><td>Comment y aller</td><td>${d.transport}</td></tr>`
              }
            </table>
          </div>
        `
        : "";

      container.innerHTML = `
        <div class="detail-media">${media}</div>

        <div class="detail-header">
          <div class="card-badges">
            <span class="category-tag ${catClass}">${icon} ${d.category || ""}</span>
            <span class="city-tag">📍 ${d.city || ""}</span>
          </div>
          <h1 class="detail-title">${d.name}</h1>
          <p class="destination-location">${d.country}</p>
        </div>

        <div class="card">
          <h2>À propos</h2>
          <p class="detail-text">${(d.long_description || d.description || "").replace(/\n\n/g, "</p><p class='detail-text'>")}</p>
        </div>

        ${activities ? `
          <div class="card">
            <h2>Que faire sur place</h2>
            <ul class="activity-list">${activities}</ul>
          </div>
        ` : ""}

        ${practical}
        ${budgetBlock}
        ${transportBlock}

        <div class="card">
          <h2>Localisation</h2>
          <div id="detail-map"></div>
        </div>

        <div class="card">
          <div>${d.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>
        </div>

        <div class="card">
          <h2>⭐ Avis des visiteurs</h2>
          <div id="reviews-summary" class="reviews-summary"></div>
          <div id="reviews-list" class="reviews-list"></div>

          <form id="review-form" class="review-form">
            <h3>Laisser un avis</h3>
            <div class="review-form-row">
              <input type="text" id="review-author" placeholder="Votre nom (facultatif)" maxlength="60" />
              <div id="review-stars" class="review-stars" data-rating="0">
                <span data-value="1">★</span><span data-value="2">★</span><span data-value="3">★</span><span data-value="4">★</span><span data-value="5">★</span>
              </div>
            </div>
            <textarea id="review-comment" rows="3" placeholder="Partagez votre expérience sur place..." maxlength="1000"></textarea>
            <button type="submit" class="wood-btn wood-btn-teal" style="max-width:220px;">Publier mon avis</button>
            <p id="review-message" class="message"></p>
          </form>
        </div>
      `;

      hydratePhotos(container);
      initReviews();

      if (typeof d.lat === "number" && typeof d.lng === "number") {
        const map = L.map('detail-map').setView([d.lat, d.lng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);
        L.marker([d.lat, d.lng]).addTo(map).bindPopup(d.name).openPopup();
      }
    }

    async function loadDetail() {
      const { ok, data } = await apiRequest(`/destinations/${DESTINATION_ID}`);
      if (ok) {
        renderDetail(data);
      } else {
        container.innerHTML = "<p class='hint'>Ce lieu est introuvable.</p>";
      }
    }

    function starsHTML(rating) {
      const full = Math.round(rating);
      return Array.from({ length: 5 }, (_, i) => (i < full ? "★" : "☆")).join("");
    }

    async function loadReviews() {
      const { ok, data } = await apiRequest(`/destinations/${DESTINATION_ID}/reviews`);
      const summaryEl = document.getElementById("reviews-summary");
      const listEl = document.getElementById("reviews-list");
      if (!ok) return;

      summaryEl.innerHTML = data.count > 0
        ? `<span class="review-average">${starsHTML(data.average)} ${data.average}/5</span> <span class="hint">(${data.count} avis)</span>`
        : `<p class="hint">Aucun avis pour le moment. Soyez le premier à partager votre expérience !</p>`;

      listEl.innerHTML = data.reviews.map((r) => `
        <div class="review-item">
          <div class="review-item-head">
            <strong>${r.author}</strong>
            <span class="review-item-stars">${starsHTML(r.rating)}</span>
          </div>
          <p>${r.comment}</p>
          <span class="review-date">${new Date(r.date).toLocaleDateString("fr-FR")}</span>
        </div>
      `).join("");
    }

    function initReviews() {
      loadReviews();

      const starsEl = document.getElementById("review-stars");
      const stars = starsEl.querySelectorAll("span");
      stars.forEach((star) => {
        star.addEventListener("click", () => {
          starsEl.dataset.rating = star.dataset.value;
          stars.forEach((s) => s.classList.toggle("filled", s.dataset.value <= star.dataset.value));
        });
      });

      const form = document.getElementById("review-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const msgEl = document.getElementById("review-message");
        const rating = parseInt(starsEl.dataset.rating, 10);
        const author = document.getElementById("review-author").value.trim();
        const comment = document.getElementById("review-comment").value.trim();

        if (!rating) {
          showMessage(msgEl, "Merci de choisir une note (1 à 5 étoiles).", "error");
          return;
        }
        if (!comment) {
          showMessage(msgEl, "Merci d'écrire un petit commentaire.", "error");
          return;
        }

        const { ok, data } = await apiRequest(`/destinations/${DESTINATION_ID}/reviews`, {
          method: "POST",
          body: { author, rating, comment },
        });

        if (ok) {
          showMessage(msgEl, "Merci pour votre avis !", "success");
          form.reset();
          starsEl.dataset.rating = "0";
          stars.forEach((s) => s.classList.remove("filled"));
          loadReviews();
        } else {
          showMessage(msgEl, data.error || "Une erreur est survenue.", "error");
        }
      });
    }

    loadDetail();
  </script>
</body>
</html>
