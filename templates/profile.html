<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon profil - GlobeTrotter Kribi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <section class="text-white py-5" style="background: linear-gradient(135deg, var(--violet) 0%, var(--orange-deep) 100%);">
    <div class="container py-3">
      <h1 class="display-6 fw-bold mb-2">👤 Mon profil</h1>
      <p class="mb-0" style="opacity:.9;">Votre compte, vos préférences et vos itinéraires</p>
    </div>
  </section>

  <main class="container my-4">
    <div id="profile-content">
      <p class="hint">Chargement de votre profil...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const contentEl = document.getElementById("profile-content");

    const PREFERENCE_LABELS = {
      culture: "Culture",
      history: "Histoire",
      nature: "Nature",
      adventure: "Aventure",
      shopping: "Shopping",
      relaxation: "Détente",
      city: "Vie urbaine",
      beach: "Plage",
    };

    const AUTH_PROVIDER_LABELS = {
      password: "Compte classique (nom d'utilisateur / mot de passe)",
      google: "Connecté via Google",
    };

    function renderProfile(user, itineraries) {
      const initials = (user.username || "?").slice(0, 2).toUpperCase();

      const prefsHTML = user.preferences && user.preferences.length
        ? user.preferences.map((p) => `<span class="badge bg-gt-orange border-0 me-1 mb-1">${PREFERENCE_LABELS[p] || p}</span>`).join("")
        : `<span class="hint">Aucune préférence renseignée pour le moment.</span>`;

      const roleBadge = user.role === "admin"
        ? `<span class="badge bg-dark ms-2">Administrateur</span>`
        : "";

      const itinerariesHTML = itineraries.length
        ? `
          <ul class="list-group list-group-flush">
            ${itineraries.map((it) => `
              <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                <div>
                  <div class="fw-semibold">${it.title}</div>
                  <div class="small text-muted">${it.start_date || "?"} → ${it.end_date || "?"}</div>
                </div>
                <a href="/itineraries-page" class="btn btn-sm btn-outline-secondary rounded-pill">Voir</a>
              </li>
            `).join("")}
          </ul>
        `
        : `
          <p class="hint mb-2">Vous n'avez pas encore créé d'itinéraire.</p>
          <a href="/destinations-page" class="btn btn-gt-teal rounded-pill px-4">Découvrir des destinations</a>
        `;

      contentEl.innerHTML = `
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm text-center p-4">
              <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle bg-gt-orange text-white fw-bold" style="width:72px;height:72px;font-size:1.5rem;">
                ${initials}
              </div>
              <h2 class="h5 mb-1">${user.username}${roleBadge}</h2>
              <p class="small text-muted mb-0">${AUTH_PROVIDER_LABELS[user.auth_provider] || "Compte classique"}</p>
              ${user.email ? `<p class="small text-muted mb-0">${user.email}</p>` : ""}
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
              <div class="card-body p-4">
                <h2 class="h6 mb-3">Centres d'intérêt</h2>
                <div>${prefsHTML}</div>
              </div>
            </div>

            <div class="card border-0 shadow-sm">
              <div class="card-body p-4">
                <h2 class="h6 mb-3">📅 Mes itinéraires (${itineraries.length})</h2>
                ${itinerariesHTML}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function loadProfile() {
      if (!isLoggedIn()) {
        window.location.href = "/login-page";
        return;
      }

      const [meResult, itinerariesResult] = await Promise.all([
        apiRequest("/me", { auth: true }),
        apiRequest("/itineraries", { auth: true }),
      ]);

      if (meResult.status === 401) {
        window.location.href = "/login-page";
        return;
      }

      if (!meResult.ok) {
        contentEl.innerHTML = `<div class="alert alert-danger">Impossible de charger votre profil pour le moment.</div>`;
        return;
      }

      const itineraries = itinerariesResult.ok ? itinerariesResult.data : [];
      renderProfile(meResult.data, itineraries);
    }

    loadProfile();
  </script>
</body>
</html>
