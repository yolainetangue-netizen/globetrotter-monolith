<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - GlobeTrotter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>🌍 GlobeTrotter</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/destinations-page">Destinations</a>
      <a href="/itineraries-page">My Itineraries</a>
      <a href="/register-page">Register</a>
      <a href="#" id="auth-link">Login</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Log in</h2>
      <form id="login-form">
        <div>
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit">Log in</button>
      </form>
      <div id="msg" class="message"></div>
      <p class="hint">Demo account: username <code>demo</code>, password <code>demo123</code></p>
    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      const { ok, data } = await apiRequest("/login", {
        method: "POST",
        body: { username, password },
      });

      if (ok) {
        setToken(data.access_token);
        showMessage(msg, `Welcome back, ${data.user.username}!`, "success");
        setTimeout(() => (window.location.href = "/destinations-page"), 800);
      } else {
        showMessage(msg, data.error || "Login failed.", "error");
      }
    });
  </script>
</body>
</html>
