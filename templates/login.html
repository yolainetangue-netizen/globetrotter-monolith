<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - GlobeTrotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>🌍 GlobeTrotter</h1>
    <nav>
      <a href="/">Accueil</a>
      <a href="/destinations-page">Destinations</a>
      <a href="/map-page">Carte</a>
      <a href="/itineraries-page">Mes itineraires</a>
      <a href="/register-page">Inscription</a>
      <a href="#" id="auth-link" class="nav-cta">Connexion</a>
    </nav>
  </header>

  <section class="auth-hero">
    <div class="auth-card">
      <p class="auth-eyebrow">GlobeTrotter</p>
      <p class="auth-tagline">Explorez le Cameroun. Voyagez mieux.</p>

      <h2 class="auth-title">Bon retour ! 👋</h2>
      <p class="auth-subtitle">Connectez-vous pour retrouver vos sorties</p>

      <form id="login-form">
        <div class="input-icon-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="username" placeholder="Nom d'utilisateur" required />
        </div>
        <div class="input-icon-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="Mot de passe" required />
        </div>
        <button type="submit" class="auth-submit">Se connecter →</button>
      </form>
      <div id="msg" class="message"></div>

      <div class="auth-divider"><span>ou</span></div>

      <a href="/register-page" class="auth-alt-btn">Creer un compte gratuitement</a>

      <p class="hint auth-hint">Compte demo : <code>demo</code> / <code>demo123</code></p>
    </div>
  </section>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      const { ok, data } = await apiRequest("/login", {
        method: "POST",
        body: { username, password },
      });

      if (ok) {
        setToken(data.access_token);
        showMessage(msg, `Bienvenue, ${data.user.username} !`, "success");
        setTimeout(() => (window.location.href = "/destinations-page"), 800);
      } else {
        showMessage(msg, data.error || "Connexion echouee.", "error");
      }
    });
  </script>
</body>
</html>
