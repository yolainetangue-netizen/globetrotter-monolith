<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - GlobeTrotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <section class="auth-hero d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center align-items-center g-5">
        <div class="col-lg-5 d-none d-lg-flex justify-content-center">
          <div class="globe-wrap" aria-hidden="true">
            <svg class="globe-orbit" viewBox="0 0 440 440">
              <circle class="orbit-ring" cx="220" cy="220" r="185" />
            </svg>
            <svg class="globe" viewBox="0 0 200 200">
              <circle class="globe-ocean" cx="100" cy="100" r="92" />
              <path class="wouri-river" d="M40,100 Q75,80 100,100 T170,95" />
              <g class="globe-land">
                <path d="M20,70 Q40,55 65,65 Q80,58 95,68 L95,130 Q80,140 60,132 Q40,140 20,128 Z" />
                <path d="M105,60 Q125,50 145,62 Q165,55 178,70 L178,125 Q160,138 140,128 Q120,136 105,122 Z" />
              </g>
              <ellipse class="globe-shine" cx="72" cy="65" rx="34" ry="20" />
            </svg>
            <span class="landmark landmark-1">🌊<em>Chutes de la Lobe</em></span>
            <span class="landmark landmark-4">🏖️<em>Plage de Kribi</em></span>
            <span class="landmark landmark-5">🐢<em>Ebodjé</em></span>
          </div>
        </div>

        <div class="col-11 col-sm-8 col-md-6 col-lg-5">
          <div class="gt-glass-card p-4 p-md-5">
            <p class="text-uppercase small fw-semibold mb-1" style="color: var(--violet); letter-spacing: 2px;">GlobeTrotter</p>
            <p class="text-muted small mb-4">Explorez Kribi. Voyagez mieux.</p>

            <h2 class="h4 mb-1">Bon retour ! 👋</h2>
            <p class="text-muted small mb-4">Connectez-vous pour retrouver vos sorties</p>

            <form id="login-form">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Nom d'utilisateur</label>
                <div class="input-group">
                  <span class="input-group-text">👤</span>
                  <input type="text" id="username" class="form-control" placeholder="Nom d'utilisateur" required />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Mot de passe</label>
                <div class="input-group">
                  <span class="input-group-text">🔒</span>
                  <input type="password" id="password" class="form-control" placeholder="Mot de passe" required />
                  <button type="button" id="toggle-password" class="btn btn-outline-secondary" aria-label="Afficher le mot de passe">👁️</button>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input type="checkbox" id="remember-me" class="form-check-input" checked />
                  <label for="remember-me" class="form-check-label small">Se souvenir de moi</label>
                </div>
                <a href="#" id="forgot-password" class="small">Mot de passe oublié ?</a>
              </div>

              <button type="submit" id="submit-btn" class="btn btn-gt-orange w-100 py-2 rounded-pill fw-semibold d-flex align-items-center justify-content-center gap-2">
                <span class="btn-label">Se connecter →</span>
                <span class="spinner-border spinner-border-sm btn-spinner" hidden></span>
              </button>
            </form>
            <div id="msg" class="mt-3"></div>
            <div id="forgot-msg" class="mt-3" style="display:none;"></div>

            <div class="text-center text-muted small my-3">ou</div>

            <a href="/register-page" class="btn btn-outline-secondary w-100 rounded-pill">Créer un compte gratuitement</a>

            <p class="hint text-center mt-3 mb-0">Compte démo : <code>demo</code> / <code>demo123</code></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");
    const btnLabel = submitBtn.querySelector(".btn-label");
    const btnSpinner = submitBtn.querySelector(".btn-spinner");

    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");
    togglePassword.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      togglePassword.textContent = isHidden ? "🙈" : "👁️";
      togglePassword.setAttribute("aria-label", isHidden ? "Masquer le mot de passe" : "Afficher le mot de passe");
    });

    const forgotLink = document.getElementById("forgot-password");
    const forgotMsg = document.getElementById("forgot-msg");
    forgotLink.addEventListener("click", (e) => {
      e.preventDefault();
      forgotMsg.style.display = "block";
      forgotMsg.innerHTML = `<div class="alert alert-warning py-2 small mb-0">La réinitialisation par e-mail n'est pas encore disponible sur cette version. Contactez l'administrateur du site pour réinitialiser votre mot de passe.</div>`;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const remember = document.getElementById("remember-me").checked;

      submitBtn.disabled = true;
      btnLabel.hidden = true;
      btnSpinner.hidden = false;

      const { ok, data } = await apiRequest("/login", {
        method: "POST",
        body: { username, password },
      });

      if (ok) {
        setToken(data.access_token, remember);
        msg.innerHTML = `<div class="alert alert-success py-2 small mb-0">Bienvenue, ${data.user.username} !</div>`;
        setTimeout(() => (window.location.href = "/destinations-page"), 800);
      } else {
        msg.innerHTML = `<div class="alert alert-danger py-2 small mb-0">${data.error || "Connexion echouee."}</div>`;
        submitBtn.disabled = false;
        btnLabel.hidden = false;
        btnSpinner.hidden = true;
      }
    });
  </script>
</body>
</html>
