<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte - GlobeTrotter Kribi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    #map {
      width: 100%;
      height: 65vh;
      min-height: 420px;
      border-radius: 12px;
      border: 1px solid var(--bs-border-color);
    }
  </style>
</head>
<body>
  {% include '_navbar.html' %}

  <main class="container my-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="h4 mb-1">Carte des destinations à Kribi</h2>
        <p class="hint">Explorez 25 lieux à Kribi.</p>

        <div class="d-flex flex-wrap gap-3 mb-3 map-legend">
          <span class="d-flex align-items-center gap-2"><i class="dot dot-heritage"></i> Sites historiques</span>
          <span class="d-flex align-items-center gap-2"><i class="dot dot-nature"></i> Nature</span>
          <span class="d-flex align-items-center gap-2"><i class="dot dot-fun"></i> Distractions</span>
          <span class="d-flex align-items-center gap-2"><i class="dot dot-food"></i> Restaurants</span>
          <span class="d-flex align-items-center gap-2"><i class="dot dot-hotel"></i> Hôtels</span>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="departure-city" class="form-label small fw-semibold">📍 Point de départ</label>
            <div class="d-flex flex-wrap gap-2">
              <select id="departure-city" class="form-select" style="max-width: 220px;">
                <option value="">-- Choisir une ville --</option>
              </select>
              <button type="button" id="gps-btn" class="btn btn-primary btn-sm">🛰️ Utiliser ma position GPS</button>
            </div>
            <div id="departure-status" class="hint mt-1"></div>
          </div>

          <div class="col-md-6">
            <label for="destination-search" class="form-label small fw-semibold">🔎 Aller à une destination</label>
            <select id="destination-search" class="form-select">
              <option value="">-- Choisir une destination (A → Z) --</option>
            </select>
          </div>
        </div>

        <div id="distance-panel" class="distance-panel mb-3" style="display:none;"></div>

        <div id="map"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const CATEGORY_COLOR = {
      "Site historique": "#1e3a6e",
      "Nature": "#2f6b4f",
      "Distraction": "#ef6c4d",
      "Restaurant": "#b8460e",
      "Hôtel": "#6d4aa8",
    };

    const CITY_COORDS = {
      "Kribi": [2.9464, 9.9074],
    };

    // Centre sur Kribi (application desormais dediee a cette ville)
    const map = L.map('map').setView([2.95, 9.91], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18,
    }).addTo(map);

    let allDestinations = [];
    const markersById = {};
    let departureCoords = null;
    let departureCityName = null; // rempli seulement si le depart vient de la liste des villes (pas du GPS)
    let departureMarker = null;
    let routeLine = null;

    const departureSelect = document.getElementById("departure-city");
    const destinationSelect = document.getElementById("destination-search");
    const departureStatus = document.getElementById("departure-status");
    const distancePanel = document.getElementById("distance-panel");
    const gpsBtn = document.getElementById("gps-btn");

    Object.keys(CITY_COORDS).sort((a, b) => a.localeCompare(b, "fr")).forEach((city) => {
      const opt = document.createElement("option");
      opt.value = city;
      opt.textContent = city;
      departureSelect.appendChild(opt);
    });

    function normalizeCity(name) {
      return (name || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = (v) => (v * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function estimateTransportCost(straightKm) {
      // Approximation route reelle ~ 1,3x la distance a vol d'oiseau
      const roadKm = straightKm * 1.3;
      const taxi = Math.round((500 + roadKm * 180) / 100) * 100;
      let moto = null;
      if (roadKm <= 30) {
        moto = Math.round((300 + roadKm * 100) / 100) * 100;
      }
      return { roadKm, taxi, moto };
    }

    function updateDistancePanel(destination) {
      if (!departureCoords || !destination) {
        distancePanel.style.display = "none";
        return;
      }
      const straightKm = haversineKm(departureCoords[0], departureCoords[1], destination.lat, destination.lng);

      const sameCity =
        departureCityName &&
        destination.city &&
        normalizeCity(departureCityName) === normalizeCity(destination.city);

      distancePanel.style.display = "block";

      if (sameCity && destination.transport && typeof destination.transport === "object") {
        // Depart et destination dans la meme ville : on utilise les tarifs reels
        // deja verifies sur la fiche, plutot que l'estimation generique.
        const t = destination.transport;
        distancePanel.innerHTML = `
          <p class="distance-headline">📏 <strong>${straightKm.toFixed(1)} km</strong> à vol d'oiseau depuis ${departureCityName} (trajet intra-urbain)</p>
          <div class="distance-prices">
            <span class="price-line price-taxi">🚕 Taxi <strong>${t.taxi || "—"}</strong></span>
            <span class="price-line price-moto">🏍️ Moto-taxi <strong>${t.moto || "—"}</strong></span>
          </div>
          ${t.note ? `<p class="hint">ℹ️ ${t.note}</p>` : ""}
          <p class="hint">✅ Tarif de référence renseigné sur la fiche de cette destination (trajet local depuis ${departureCityName}).</p>
        `;
      } else {
        // Trajet interurbain ou depart GPS : estimation par la distance uniquement.
        const { roadKm, taxi, moto } = estimateTransportCost(straightKm);
        distancePanel.innerHTML = `
          <p class="distance-headline">📏 <strong>${straightKm.toFixed(0)} km</strong> à vol d'oiseau depuis le point de départ
          (≈ <strong>${roadKm.toFixed(0)} km</strong> par la route, estimation)</p>
          <div class="distance-prices">
            <span class="price-line price-taxi">🚕 Taxi (estimation) <strong>≈ ${taxi.toLocaleString("fr-FR")} FCFA</strong></span>
            ${moto !== null
              ? `<span class="price-line price-moto">🏍️ Moto-taxi (estimation) <strong>≈ ${moto.toLocaleString("fr-FR")} FCFA</strong></span>`
              : `<span class="price-line price-moto">🏍️ Moto-taxi non recommandée sur cette distance — privilégiez un taxi ou une agence de voyage.</span>`
            }
          </div>
          <p class="hint">⚠️ Estimation basée uniquement sur la distance à vol d'oiseau, sans tenir compte du trafic réel. Pour un trajet local en ville, sélectionnez la ville de la destination comme point de départ afin d'afficher le tarif de référence vérifié.</p>
        `;
      }

      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline([departureCoords, [destination.lat, destination.lng]], {
        color: "#f2751a",
        weight: 3,
        dashArray: "6,8",
      }).addTo(map);
    }

    function setDeparture(coords, label, cityName) {
      departureCoords = coords;
      departureCityName = cityName || null;
      departureStatus.textContent = `Départ : ${label}`;

      if (departureMarker) map.removeLayer(departureMarker);
      departureMarker = L.marker(coords, {
        icon: L.divIcon({ className: "departure-pin", html: "🚩", iconSize: [24, 24] }),
      }).addTo(map).bindPopup(`Départ : ${label}`);

      const selectedId = destinationSelect.value;
      if (selectedId) {
        const dest = allDestinations.find((d) => String(d.id) === selectedId);
        updateDistancePanel(dest);
      }
    }

    departureSelect.addEventListener("change", () => {
      const city = departureSelect.value;
      if (!city) return;
      setDeparture(CITY_COORDS[city], city, city);
    });

    gpsBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        departureStatus.textContent = "La géolocalisation n'est pas disponible sur ce navigateur.";
        return;
      }
      departureStatus.textContent = "Localisation en cours...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          departureSelect.value = "";
          setDeparture([pos.coords.latitude, pos.coords.longitude], "ma position actuelle");
        },
        () => {
          departureStatus.textContent = "Impossible d'obtenir votre position. Choisissez une ville de départ.";
        }
      );
    });

    destinationSelect.addEventListener("change", () => {
      const id = destinationSelect.value;
      if (!id) {
        distancePanel.style.display = "none";
        return;
      }
      const dest = allDestinations.find((d) => String(d.id) === id);
      if (!dest) return;

      map.setView([dest.lat, dest.lng], 14);
      const marker = markersById[dest.id];
      if (marker) marker.openPopup();

      updateDistancePanel(dest);
    });

    async function loadMapPoints() {
      const { ok, data } = await apiRequest('/destinations');
      if (!ok) return;

      allDestinations = data.filter((d) => typeof d.lat === "number" && typeof d.lng === "number");
      const bounds = [];

      allDestinations.forEach((d) => {
        const color = CATEGORY_COLOR[d.category] || "#1e3a6e";
        const marker = L.circleMarker([d.lat, d.lng], {
          radius: 8,
          fillColor: color,
          color: "#ffffff",
          weight: 2,
          fillOpacity: 0.9,
        }).addTo(map);

        marker.bindPopup(`
          <strong>${d.name}</strong><br/>
          <span style="color:#6b7280;font-size:0.85em;">${d.city || d.country}</span><br/>
          <span style="font-size:0.85em;">${d.description}</span><br/>
          <a href="/destination/${d.id}" style="font-size:0.85em;">Voir la fiche &rarr;</a>
        `);

        markersById[d.id] = marker;
        bounds.push([d.lat, d.lng]);
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }

      const sorted = [...allDestinations].sort((a, b) => a.name.localeCompare(b.name, "fr"));
      sorted.forEach((d) => {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = `${d.name} (${d.city})`;
        destinationSelect.appendChild(opt);
      });
    }

    loadMapPoints();
  </script>
</body>
</html>
